<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security | NestControl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-auth="required">

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="fa-solid fa-house-signal"></i></div>
      <span class="brand-name">NestControl</span>
      <button class="sidebar-close" id="sidebarClose"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <i class="fa-solid fa-gauge-high"></i><span>Dashboard</span>
      </a>
      <a href="rooms.html" class="nav-item">
        <i class="fa-solid fa-door-open"></i><span>Rooms</span>
      </a>
      <a href="devices.html" class="nav-item">
        <i class="fa-solid fa-lightbulb"></i><span>Devices</span>
      </a>
      <a href="energy.html" class="nav-item">
        <i class="fa-solid fa-bolt"></i><span>Energy</span>
      </a>
      <a href="environment.html" class="nav-item">
        <i class="fa-solid fa-temperature-half"></i><span>Environment</span>
      </a>
      <a href="security.html" class="nav-item active">
        <i class="fa-solid fa-shield-halved"></i><span>Security</span>
      </a>
      <a href="automation.html" class="nav-item">
        <i class="fa-solid fa-gears"></i><span>Automations</span>
      </a>
      <a href="history.html" class="nav-item">
        <i class="fa-solid fa-clock-rotate-left"></i><span>Activity</span>
      </a>
      <a href="notifications.html" class="nav-item" id="navNotifications">
        <i class="fa-solid fa-bell"></i><span>Notifications</span>
      </a>
      <a href="profile.html" class="nav-item">
        <i class="fa-solid fa-user"></i><span>Profile</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="login.html" class="nav-item logout-link">
        <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
      </a>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main content -->
  <div class="main-wrapper">
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-title">Security Center</div>

      <div class="topbar-actions">
        <div class="notif-wrapper">
          <button class="icon-btn" id="notifBtn">
            <i class="fa-solid fa-bell"></i>
          </button>
          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-dropdown-header">Notifications</div>
            <div class="notif-dropdown-body" id="notifDropdownBody">
              <div class="empty-mini">Loading...</div>
            </div>
            <a href="notifications.html" class="notif-dropdown-footer">View all</a>
          </div>
        </div>

        <a href="profile.html" class="user-chip">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="user-name" id="userNameLabel"></span>
        </a>
      </div>
    </header>

    <main class="content">
      <div id="flashHost"></div>
<div class="page-heading">
  <h1>Home Security</h1>
  <p>Monitor and control your home's security system.</p>
</div>

<div class="security-status-card">
  <div class="security-status-left">
    <div class="security-icon armed">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <div>
      <h3 id="securityStatusText">System Armed</h3>
      <p>Your home is protected.</p>
    </div>
  </div>
  <div class="security-status-actions">
    <button class="btn-secondary" id="disarmBtn">Disarm</button>
    <button class="btn-primary" id="armBtn">Arm System</button>
  </div>
</div>

<div class="chart-grid">
  <div class="card">
    <h3>Smart Door</h3>
    <div id="doorHolder"></div>
  </div>

  <div class="card">
    <h3>Security Events</h3>
    <div id="eventsHolder"></div>
  </div>
</div>

    </main>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/security.js"></script>
</body>
</html>

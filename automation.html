<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automation | NestControl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-auth="required">

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="fa-solid fa-house-signal"></i></div>
      <span class="brand-name">NestControl</span>
      <button class="sidebar-close" id="sidebarClose"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <i class="fa-solid fa-gauge-high"></i><span>Dashboard</span>
      </a>
      <a href="rooms.html" class="nav-item">
        <i class="fa-solid fa-door-open"></i><span>Rooms</span>
      </a>
      <a href="devices.html" class="nav-item">
        <i class="fa-solid fa-lightbulb"></i><span>Devices</span>
      </a>
      <a href="energy.html" class="nav-item">
        <i class="fa-solid fa-bolt"></i><span>Energy</span>
      </a>
      <a href="environment.html" class="nav-item">
        <i class="fa-solid fa-temperature-half"></i><span>Environment</span>
      </a>
      <a href="security.html" class="nav-item">
        <i class="fa-solid fa-shield-halved"></i><span>Security</span>
      </a>
      <a href="automation.html" class="nav-item active">
        <i class="fa-solid fa-gears"></i><span>Automations</span>
      </a>
      <a href="history.html" class="nav-item">
        <i class="fa-solid fa-clock-rotate-left"></i><span>Activity</span>
      </a>
      <a href="notifications.html" class="nav-item" id="navNotifications">
        <i class="fa-solid fa-bell"></i><span>Notifications</span>
      </a>
      <a href="profile.html" class="nav-item">
        <i class="fa-solid fa-user"></i><span>Profile</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="login.html" class="nav-item logout-link">
        <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
      </a>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main content -->
  <div class="main-wrapper">
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-title">Automations</div>

      <div class="topbar-actions">
        <div class="notif-wrapper">
          <button class="icon-btn" id="notifBtn">
            <i class="fa-solid fa-bell"></i>
          </button>
          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-dropdown-header">Notifications</div>
            <div class="notif-dropdown-body" id="notifDropdownBody">
              <div class="empty-mini">Loading...</div>
            </div>
            <a href="notifications.html" class="notif-dropdown-footer">View all</a>
          </div>
        </div>

        <a href="profile.html" class="user-chip">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="user-name" id="userNameLabel"></span>
        </a>
      </div>
    </header>

    <main class="content">
      <div id="flashHost"></div>
<div class="page-heading-row">
  <div class="page-heading">
    <h1>Automations</h1>
    <p>Create rules to automate your home.</p>
  </div>
  <button class="btn-primary" id="addAutomationBtn"><i class="fa-solid fa-plus"></i> New Automation</button>
</div>

<div class="automation-list" id="automationList"></div>

<div class="modal-overlay" id="automationModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>New Automation</h3>
      <button class="icon-btn-sm modal-close" data-close="automationModal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="autoNameInput">Automation name</label>
        <input type="text" id="autoNameInput" placeholder="e.g. Evening Lights">
      </div>
      <div class="form-group">
        <label for="autoConditionInput">IF condition</label>
        <input type="text" id="autoConditionInput" placeholder="e.g. Time = 7:00 PM">
      </div>
      <div class="form-group">
        <label for="autoActionInput">THEN action</label>
        <input type="text" id="autoActionInput" placeholder="e.g. Living Room Light = ON">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" data-close="automationModal">Cancel</button>
      <button class="btn-primary" id="saveAutomationBtn">Save</button>
    </div>
  </div>
</div>

    </main>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/automation.js"></script>
</body>
</html>
